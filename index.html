<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour de France 2027 &mdash; Rhondda Valleys</title>
  <meta name="description" content="An interactive fan map of an imagined Tour de France stage through the Rhondda Valleys, with nearby walking routes to explore.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Tour de France 2027 &mdash; Rhondda Valleys</h1>
    <button id="toggleSidebar" aria-label="Toggle panel" aria-expanded="true">&#9776;</button>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <section id="walk-picker" class="walk-picker">
        <h3>Walk a route</h3>
        <ul id="walk-list" class="walk-list"></ul>
        <p class="hint">Or click any trail on the map.</p>
      </section>

      <section id="details" class="details-panel">
        <p class="hint">Click a route, marker, or trail on the map for more information.</p>
      </section>
    </aside>

    <main id="map"></main>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" aria-label="Choose a walking route">
      <div class="onboarding-card">
        <h2>Choose a walk to get started</h2>
        <p class="hint">Pick a walking route near the stage to see its points of interest.</p>
        <ul id="onboarding-list" class="onboarding-list">
          <li class="hint">Loading walks&hellip;</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
